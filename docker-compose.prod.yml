# Canlı ortam: tek sunucuda veritabanı, API, web, HTTPS (Caddy) ve günlük yedek.
#   cp deploy/.env.prod.example .env    # değerleri doldurun
#   docker compose -f docker-compose.prod.yml up -d --build
# Ayrıntılar: docs/CANLI-KURULUM.md
#
# Dışarıya yalnızca Caddy'nin 80/443 portları açılır. Veritabanı, API ve web yalnızca iç ağdadır.
name: kvkk

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kvkk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
      POSTGRES_DB: kvkk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvkk -d kvkk"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kvkk:${POSTGRES_PASSWORD}@postgres:5432/kvkk
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env dosyasında tanımlı olmalı}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY .env dosyasında tanımlı olmalı}
      SMTP_URL: ${SMTP_URL:?SMTP_URL .env dosyasında tanımlı olmalı}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM .env dosyasında tanımlı olmalı}
      APP_URL: https://${DOMAIN:?DOMAIN .env dosyasında tanımlı olmalı}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:?PLATFORM_ADMIN_EMAILS .env dosyasında tanımlı olmalı}
      VERIMOR_USERNAME: ${VERIMOR_USERNAME:-}
      VERIMOR_PASSWORD: ${VERIMOR_PASSWORD:-}
      SMS_HEADER: ${SMS_HEADER:-KVK UYUM}
      ALARM_INTERVAL_MINUTES: "60"
      TRIAL_DAYS: ${TRIAL_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      # Web'in önünde tek bir vekil (Caddy) var; istemcinin gerçek IP'si buna göre hesaplanır.
      # Caddy'nin de önüne bir yük dengeleyici konursa 2 yapılmalı.
      TRUSTED_PROXY_HOPS: "1"
    depends_on:
      - api

  # HTTPS: Let's Encrypt sertifikasını kendisi alır ve yeniler. Alan adının DNS kaydı bu sunucuyu göstermeli.
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-ek:/etc/caddy/ek:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Her gece veritabanı yedeği alır (./yedekler klasörüne), BACKUP_KEEP_DAYS günden eskileri siler.
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: kvkk
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: kvkk
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Europe/Istanbul
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./yedekler:/backups
    entrypoint: ["bash", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
