# Her PR'da ve main'e her gönderimde: derleme, tip kontrolü, API testleri ve Docker imajlarının derlenmesi.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: kvkk_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ortak paket
        run: pnpm --filter @kvkk/shared build
      - name: API tip kontrolü ve derleme
        run: pnpm --filter @kvkk/api typecheck && pnpm --filter @kvkk/api build
      - name: API testleri
        run: pnpm --filter @kvkk/api test
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5433/kvkk_test
      - name: Web tip kontrolü ve derleme
        run: pnpm --filter @kvkk/web typecheck && pnpm --filter @kvkk/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Bağımlılık açıkları (yalnızca yüksek ve kritik)
        run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API, web ve yedek imajları
        run: |
          docker buildx build --target api -t kvkk-api .
          docker buildx build --target web -t kvkk-web .
          docker buildx build --target offsite -t kvkk-offsite .
